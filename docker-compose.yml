# 本機開發用 PostgreSQL：docker compose up -d
services:
  db:
    image: postgres:16
    container_name: linebot-dev-db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: linebot_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 網頁版資料庫管理介面：http://localhost:8080
  # 登入：系統 PostgreSQL / 伺服器 db / 帳號 dev / 密碼 dev / 資料庫 linebot_dev
  adminer:
    image: adminer
    container_name: linebot-dev-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
